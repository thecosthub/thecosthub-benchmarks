name: Sync to DynamoDB

on:
  push:
    branches: [main]
    paths:
      - "tasks/**"

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Determine changed tasks
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- tasks/ | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Sync changed benchmarks to DynamoDB
        run: npx ts-node scripts/sync-to-dynamodb.ts ${{ steps.changed.outputs.files }}
        env:
          DYNAMODB_TABLE_BENCHMARKS: TheCostHubBenchmarks
          AWS_REGION: eu-west-2

      - name: Generate result snapshot
        run: |
          mkdir -p results
          npx ts-node scripts/generate-result-snapshot.ts ${{ steps.changed.outputs.files }}

      - name: Commit result snapshots
        run: |
          git config user.name "TheCostHub Bot"
          git config user.email "bot@thecosthub.com"
          git add results/
          git diff --staged --quiet || git commit -m "chore: update result snapshots [skip ci]"
          git push
